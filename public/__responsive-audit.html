<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Responsive audit</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; background: #0b1220; color: #e2e8f0; font: 12px/1.4 ui-sans-serif, system-ui, sans-serif; }
      .row { display: flex; gap: 16px; padding: 16px; align-items: flex-start; overflow-x: auto; }
      .col { flex: 0 0 auto; }
      .label { position: sticky; top: 0; z-index: 2; padding: 6px 10px; margin-bottom: 6px; border-radius: 8px; background: #1e293b; font-weight: 600; }
      iframe { display: block; border: 0; background: #fff; border-radius: 8px; box-shadow: 0 12px 40px rgba(0,0,0,.35); }
    </style>
  </head>
  <body>
    <div class="row" id="row"></div>
    <script>
      const params = new URLSearchParams(location.search);
      const paths = (params.get("paths") || "/").split(",").filter(Boolean);
      const widths = (params.get("widths") || "390,768,1280").split(",").map(Number).filter(Boolean);
      const height = Number(params.get("height") || 1800);
      const row = document.getElementById("row");
      for (const path of paths) {
        for (const width of widths) {
          const col = document.createElement("div");
          col.className = "col";
          const label = document.createElement("div");
          label.className = "label";
          label.textContent = `${width}px · ${path}`;
          const frame = document.createElement("iframe");
          frame.width = width;
          frame.height = height;
          frame.loading = "eager";
          frame.src = path;
          col.append(label, frame);
          row.appendChild(col);
        }
      }
    </script>
  </body>
</html>
