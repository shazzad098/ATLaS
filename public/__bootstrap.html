<!doctype html>
<html>
  <head><meta charset="utf-8" /><title>Bootstrap</title></head>
  <body>
    <script>
      const params = new URLSearchParams(location.search);
      const token = params.get("token");
      const buyer = params.get("buyer");
      const next = params.get("next") || "/";
      if (token) {
        document.cookie = "atlas_at=" + encodeURIComponent(token) + "; path=/; SameSite=Lax";
      }
      if (params.get("clear")) {
        document.cookie = "atlas_at=; path=/; max-age=0";
        document.cookie = "atlas_buyer=; path=/; max-age=0";
      }
      if (buyer) {
        document.cookie = "atlas_buyer=" + encodeURIComponent(buyer) + "; path=/; SameSite=Lax";
      }
      location.replace(next);
    </script>
  </body>
</html>
