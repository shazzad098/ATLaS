name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atlas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/atlas_test?sslmode=disable
      AUTH_SECRET: ci-auth-secret-at-least-32-characters-long
      OTP_HASH_SECRET: ci-otp-secret-at-least-32-characters-long
      CRON_SECRET: ci-cron-secret
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      APP_ROOT_DOMAIN: atlas.example
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

      - name: Generate Prisma client
        run: npx prisma generate

      # The schema is applied through the migration chain, never `db push`, so a
      # migration that does not reproduce the schema fails here instead of in
      # production. The RLS policies are part of that chain.
      - name: Apply migrations to ephemeral database
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # The same suite plus coverage, with minimum thresholds so a change that
      # drops the tested surface fails the build instead of quietly lowering it.
      - name: Integration tests with coverage gates
        run: npm run test:coverage

      - name: Production build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atlas_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/atlas_e2e?sslmode=disable
      AUTH_SECRET: ci-auth-secret-at-least-32-characters-long
      OTP_HASH_SECRET: ci-otp-secret-at-least-32-characters-long
      SECRETS_KEY: ci-secrets-key-at-least-32-characters-long
      CRON_SECRET: ci-cron-secret
      SEED_PASSWORD: ci-seed-password
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      APP_ROOT_DOMAIN: atlas.example
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Seed the demo data
        run: npm run db:seed

      - name: Production build
        run: npm run build

      # Start, wait for readiness, run the HTTP suite, and always stop the
      # server. One step so the background process cannot be reaped between
      # steps, and so a failure leaves a clear single log.
      - name: Smoke tests (HTTP end to end)
        run: |
          npm start &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          ready=""
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/v1/health > /dev/null; then
              echo "server ready after ${attempt} attempt(s)"
              ready="yes"
              break
            fi
            sleep 2
          done
          if [ -z "$ready" ]; then
            echo "server did not become ready within 120s"
            exit 1
          fi

          E2E_BASE_URL=http://127.0.0.1:3000 npm run test:e2e

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build -t atlas:ci .
